ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ app.stockchecker.server.ApplicationKt.module ]
  }
}

stockchecker {
  # Dev mode: login codes are logged and returned in the API response; never enable in production.
  devMode = true
  devMode = ${?DEV_MODE}
  publicBaseUrl = "http://localhost:8080"
  publicBaseUrl = ${?PUBLIC_BASE_URL}
  corsHosts = ${?CORS_HOSTS}

  db {
    # Default: H2 file database in ./server/data (Postgres compatibility mode).
    # Production: DATABASE_URL=jdbc:postgresql://host:5432/stockchecker
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
  }

  vapid {
    # Generate with: ./gradlew :server:generateVapidKeys
    publicKey = ${?VAPID_PUBLIC_KEY}
    privateKey = ${?VAPID_PRIVATE_KEY}
    subject = ${?VAPID_SUBJECT}
  }

  smtp {
    # Leave SMTP_HOST unset to log emails to the console instead of sending them.
    host = ${?SMTP_HOST}
    port = ${?SMTP_PORT}
    username = ${?SMTP_USERNAME}
    password = ${?SMTP_PASSWORD}
    from = ${?SMTP_FROM}
    startTls = ${?SMTP_STARTTLS}
  }

  retailers {
    bestBuyApiKey = ${?BESTBUY_API_KEY}
    bestBuyBaseUrl = ${?BESTBUY_API_BASE_URL}
    enableMock = ${?ENABLE_MOCK_RETAILER}
  }

  scheduler {
    enabled = ${?SCHEDULER_ENABLED}
    intervalSeconds = ${?CHECK_INTERVAL_SECONDS}
    emailFallbackMinutes = ${?EMAIL_FALLBACK_MINUTES}
  }

  web {
    # Directory with the built web app; defaults to webApp/build/dist/wasmJs/productionExecutable.
    staticDir = ${?WEB_STATIC_DIR}
  }
}

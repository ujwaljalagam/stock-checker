# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && cd iosApp && xcodegen generate && open iosApp.xcodeproj
name: iosApp
options:
  bundleIdPrefix: app.stockchecker
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The shared framework is static (isStatic = true in shared/build.gradle.kts).
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Stock Checker
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.stockchecker.refresh]
        # Dev server on the Mac running the simulator. Change for production (HTTPS).
        StockCheckerServerURL: http://localhost:8080
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
